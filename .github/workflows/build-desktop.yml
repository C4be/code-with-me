name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            bundles: appimage,deb
            artifact: code-with-me-linux-x64
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - name: Windows x64
            platform: windows-latest
            bundles: nsis
            artifact: code-with-me-windows-x64
            paths: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS
            platform: macos-latest
            bundles: dmg
            artifact: code-with-me-macos
            paths: src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates curl file \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget xdg-utils

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
